name: Build and Push Frontend Image

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'Dockerfile.frontend'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-image.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: cloudx-frontend
  REGISTRY: ghcr.io
  FRONTEND_API_BASE_URL: ${{ vars.FRONTEND_API_BASE_URL || 'http://localhost:5001' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute registry owner (lowercase)
        id: registry-owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.registry-owner.outputs.value }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          build-args: |
            FRONTEND_API_BASE_URL=${{ env.FRONTEND_API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.value }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.value }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Built with FRONTEND_API_BASE_URL=${FRONTEND_API_BASE_URL}"
          echo "Pushed:"
          echo "  ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.value }}/${{ env.IMAGE_NAME }}:latest"
          echo "  ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.value }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
