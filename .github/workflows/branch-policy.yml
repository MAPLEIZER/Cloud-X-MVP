name: Branch Policy

on:
  push:
    branches:
      - main
      - staging
      - dev
      - feature/backend
      - feature/frontend
  pull_request:
    branches:
      - main
      - staging
      - dev
      - feature/backend
      - feature/frontend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate machine policy
        run: python3 scripts/ci/branch_policy.py validate
      - name: Run governance tests
        run: python3 -m unittest discover -s tests -p 'test_branch*.py'
      - name: Classify current ref (report only)
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/ci/branch_policy.py classify "$BRANCH_NAME"
