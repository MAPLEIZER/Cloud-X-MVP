name: Release Appliance

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build immutable Cloud-X release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Refuse existing release mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate published release state." >&2
            exit 1
          fi

      - name: Re-audit Node dependencies at release time
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            node:24-alpine \
            sh -ec '
              npm install --global pnpm@10.34.5 >/dev/null
              pnpm audit --audit-level high
            '

      - name: Re-audit Python dependencies at release time
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            python:3.13-slim \
            sh -ec '
              python -m venv /tmp/cloudx-audit
              /tmp/cloudx-audit/bin/python -m pip install \
                --disable-pip-version-check \
                --no-cache-dir \
                --timeout 60 \
                --retries 5 \
                -r cloudx-flask-backend/requirements.txt >/dev/null
              python -m pip install \
                --disable-pip-version-check \
                --no-cache-dir \
                --timeout 60 \
                --retries 5 \
                pip-audit==2.10.1 >/dev/null
              audit_path=$(/tmp/cloudx-audit/bin/python -c "import site; print(site.getsitepackages()[0])")
              pip-audit \
                --progress-spinner off \
                --vulnerability-service osv \
                --timeout 60 \
                --path "$audit_path"
            '

      - name: Validate release tooling
        shell: bash
        run: |
          find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m unittest tests/test_release_bundle.py

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mapleizer/cloudx-frontend:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./cloudx-flask-backend
          file: ./cloudx-flask-backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mapleizer/cloudx-backend:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Attest frontend provenance with GitHub/Sigstore identity
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/mapleizer/cloudx-frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

      - name: Attest backend provenance with GitHub/Sigstore identity
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/mapleizer/cloudx-backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

      - name: Verify published image signing identity
        shell: bash
        env:
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          set -euo pipefail
          signer="github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          gh attestation verify \
            "oci://ghcr.io/mapleizer/cloudx-frontend@${FRONTEND_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify \
            "oci://ghcr.io/mapleizer/cloudx-backend@${BACKEND_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com

      - name: Resolve immutable infrastructure images
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          resolve() {
            image=$1
            docker pull "$image" >/dev/null
            repo_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
            [[ "$repo_digest" =~ @sha256:[0-9a-f]{64}$ ]]
            printf '%s' "$repo_digest"
          }
          echo "postgres=$(resolve postgres:17-alpine)" >> "$GITHUB_OUTPUT"
          echo "redis=$(resolve redis:8-alpine)" >> "$GITHUB_OUTPUT"
          echo "nginx=$(resolve nginx:alpine)" >> "$GITHUB_OUTPUT"

      - name: Build digest-pinned appliance bundle
        shell: bash
        env:
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          POSTGRES_IMAGE: ${{ steps.infra.outputs.postgres }}
          REDIS_IMAGE: ${{ steps.infra.outputs.redis }}
          NGINX_IMAGE: ${{ steps.infra.outputs.nginx }}
        run: |
          set -euo pipefail
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          bundle="dist/cloudx-appliance-${GITHUB_REF_NAME}"
          python3 scripts/release/build_release_bundle.py \
            --version "$GITHUB_REF_NAME" \
            --source-tag "$GITHUB_REF_NAME" \
            --source-commit "$SOURCE_SHA" \
            --migration-revision "20260814_0002" \
            --frontend-image "ghcr.io/mapleizer/cloudx-frontend@${FRONTEND_DIGEST}" \
            --backend-image "ghcr.io/mapleizer/cloudx-backend@${BACKEND_DIGEST}" \
            --postgres-image "$POSTGRES_IMAGE" \
            --redis-image "$REDIS_IMAGE" \
            --nginx-image "$NGINX_IMAGE" \
            --repository "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --output "$bundle"

          tar -C dist -czf "${bundle}.tar.gz" "$(basename "$bundle")"
          sha256sum "${bundle}.tar.gz" > "${bundle}.tar.gz.sha256"

      - name: Attest appliance archive
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/cloudx-appliance-${{ github.ref_name }}.tar.gz

      - name: Verify and export appliance attestation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="dist/cloudx-appliance-${GITHUB_REF_NAME}.tar.gz"
          signer="github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          gh attestation verify "$artifact" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com

          mkdir -p dist/attestations
          (
            cd dist/attestations
            gh attestation download "../cloudx-appliance-${GITHUB_REF_NAME}.tar.gz" \
              --repo "$GITHUB_REPOSITORY"
            attestation_file="$(find . -maxdepth 1 -type f -name 'sha256:*.jsonl' -print -quit)"
            test -n "$attestation_file"
            mv "$attestation_file" "cloudx-appliance-${GITHUB_REF_NAME}.attestation.jsonl"
            gh attestation trusted-root > trusted_root.jsonl
          )

      - name: Publish immutable GitHub prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="dist/cloudx-appliance-${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "Cloud-X ${GITHUB_REF_NAME} pre-production candidate" \
            --notes "Cloud-X appliance candidate. Verify GitHub/Sigstore attestations, release evidence and #28 acceptance before declaring customer support." \
            "${bundle}.tar.gz" \
            "${bundle}.tar.gz.sha256" \
            "dist/attestations/cloudx-appliance-${GITHUB_REF_NAME}.attestation.jsonl" \
            "dist/attestations/trusted_root.jsonl"
