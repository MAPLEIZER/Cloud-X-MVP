name: Docker Build
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - staging
      - dev
      - feature/backend
      - feature/frontend
  pull_request:
    branches:
      - main
      - staging
      - dev
      - feature/backend
      - feature/frontend

jobs:
  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and export
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.frontend
          tags: frontend:latest
          load: true
  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts
        run: |
          bash -n install_backend.sh
          find cloudx-flask-backend/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path cloudx-flask-backend,cloudx-security-agent -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax errors in $($_.FullName): $($errors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and export
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./cloudx-flask-backend
          file: ./cloudx-flask-backend/Dockerfile
          tags: backend:latest
          load: true
      - name: Verify backend runtime is unprivileged
        run: |
          docker run --rm --entrypoint sh backend:latest -c '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test -w /data
            test ! -w /app/app.py
          '
      - name: Smoke-test Nmap as the runtime user
        run: |
          docker run --rm --entrypoint nmap backend:latest \
            -T4 -F -v -oX - 127.0.0.1 >/dev/null
      - name: Run backend security regression tests
        run: docker run --rm --entrypoint python backend:latest -m unittest discover -s /app/tests
