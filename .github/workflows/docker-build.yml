name: Docker Build
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - staging
      - dev
      - feature/backend
      - feature/frontend
  pull_request:
    branches:
      - main
      - staging
      - dev
      - feature/backend
      - feature/frontend

jobs:
  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and export
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.frontend
          tags: frontend:latest
          load: true
  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts
        run: |
          bash -n install_backend.sh
          find cloudx-flask-backend/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path cloudx-flask-backend,cloudx-security-agent -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax errors in $($_.FullName): $($errors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Validate reverse-proxy nginx configuration
        run: |
          docker run --rm \
            -e BACKEND_UPSTREAM=http://backend:5001 \
            -e FRONTEND_UPSTREAM=http://frontend:80 \
            -v "$PWD/deploy/reverse-proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:alpine nginx -t
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and export
        uses: docker/build-push-action@53b7df96c91f9d12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./cloudx-flask-backend
          file: ./cloudx-flask-backend/Dockerfile
          tags: backend:latest
          load: true
      - name: Verify backend runtime is unprivileged
        run: |
          docker run --rm --entrypoint sh backend:latest -c '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test -w /data
            test ! -w /app/app.py
          '
      - name: Smoke-test Nmap as the runtime user
        run: |
          docker run --rm --cap-add NET_RAW --entrypoint nmap backend:latest \
            -T4 -F -v -oX - 127.0.0.1 >/dev/null
      - name: Verify migrations and durable RQ scan lifecycle
        run: |
          set -euo pipefail
          network="cloudx-ci-${GITHUB_RUN_ID}"
          postgres="cloudx-postgres-${GITHUB_RUN_ID}"
          redis="cloudx-redis-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$postgres" "$redis" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run -d --name "$postgres" --network "$network" \
            -e POSTGRES_DB=cloudx \
            -e POSTGRES_USER=cloudx \
            -e POSTGRES_PASSWORD=cloudx-ci-password \
            postgres:17-alpine >/dev/null
          docker run -d --name "$redis" --network "$network" \
            redis:8-alpine redis-server --appendonly yes --appendfsync everysec >/dev/null

          postgres_ready=0
          redis_ready=0
          for _ in $(seq 1 30); do
            if docker exec "$postgres" pg_isready -U cloudx -d cloudx >/dev/null 2>&1; then
              postgres_ready=1
            fi
            if docker exec "$redis" redis-cli ping 2>/dev/null | grep -qx PONG; then
              redis_ready=1
            fi
            if [[ "$postgres_ready" = "1" && "$redis_ready" = "1" ]]; then
              break
            fi
            sleep 1
          done
          test "$postgres_ready" = "1"
          test "$redis_ready" = "1"

          runtime_env=(
            -e "DATABASE_URL=postgresql+psycopg://cloudx:cloudx-ci-password@${postgres}:5432/cloudx"
            -e "REDIS_URL=redis://${redis}:6379/0"
            -e "CLERK_SECRET_KEY=sk_test_ci_only"
            -e "CLERK_AUTHORIZED_PARTIES=http://localhost:5173"
            -e "CLERK_ALLOWED_USER_IDS=user_ci"
          )

          docker run --rm --network "$network" "${runtime_env[@]}" \
            --entrypoint alembic backend:latest upgrade head
          # A second upgrade must be a no-op rather than failing.
          docker run --rm --network "$network" "${runtime_env[@]}" \
            --entrypoint alembic backend:latest upgrade head

          test "$(docker exec "$postgres" psql -U cloudx -d cloudx -tAc "SELECT to_regclass('public.scan')")" = "scan"
          test "$(docker exec "$postgres" psql -U cloudx -d cloudx -tAc "SELECT version_num FROM alembic_version")" = "20260814_0002"
          test "$(docker exec "$postgres" psql -U cloudx -d cloudx -tAc "SELECT count(*) FROM information_schema.columns WHERE table_name='scan' AND column_name='updated_at'")" = "1"

          # Seed in one short-lived process, then execute in a different worker
          # container to prove jobs do not depend on the submitting/API process.
          docker run --rm --network "$network" "${runtime_env[@]}" \
            --entrypoint python backend:latest /app/tests/queue_integration_probe.py seed

          docker run --rm --network "$network" --cap-add NET_RAW \
            "${runtime_env[@]}" --entrypoint rq backend:latest \
            worker --burst --worker-class scan_jobs.CloudXWorker \
            --serializer json --url "redis://${redis}:6379/0" scans

          docker run --rm --network "$network" "${runtime_env[@]}" \
            --entrypoint python backend:latest /app/tests/queue_integration_probe.py verify
      - name: Run backend security regression tests
        run: docker run --rm --entrypoint python backend:latest -m unittest discover -s /app/tests
