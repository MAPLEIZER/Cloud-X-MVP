name: Docker Build
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - staging
      - dev
      - feature/backend
      - feature/frontend
  pull_request:
    branches:
      - main
      - staging
      - dev
      - feature/backend
      - feature/frontend

jobs:
  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and export
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.frontend
          tags: frontend:latest
          load: true
  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts
        run: |
          bash -n install_backend.sh
          find cloudx-flask-backend/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path cloudx-flask-backend,cloudx-security-agent -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax errors in $($_.FullName): $($errors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and export
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./cloudx-flask-backend
          file: ./cloudx-flask-backend/Dockerfile
          tags: backend:latest
          load: true
      - name: Run backend security regression tests
        run: docker run --rm --entrypoint python backend:latest -m unittest discover -s /app/tests
