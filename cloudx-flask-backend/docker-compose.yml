services:
  backend:
    build: .
    image: cloudx-backend:latest
    container_name: cloudx-backend
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/scans.db
    volumes:
      - ./scans.db:/app/scans.db
      - ./server_identity.json:/app/server_identity.json
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
